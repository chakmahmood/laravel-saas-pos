        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Items]
      summary: Update sebagian item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                type: { $ref: '#/components/schemas/ItemType' }
                category_id: { type: [integer, "null"] }
                sku: { type: [string, "null"] }
                barcode: { type: [string, "null"] }
                description: { type: [string, "null"] }
                cost_price: { type: [integer, "null"] }
                selling_price: { type: integer }
                unit: { type: [string, "null"] }
                is_active: { type: boolean }
                tracks_stock: { type: boolean }
      responses:
        '200': { description: Item diperbarui. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: item_inventory_in_use }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Items]
