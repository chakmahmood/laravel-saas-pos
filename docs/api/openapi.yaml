      responses:
        '200': { description: Lokasi dihapus. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Lokasi default atau masih dirujuk.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                default: { value: { message: Lokasi default tidak dapat dihapus., code: default_stock_location_protected } }
                in_use: { value: { message: Lokasi stok masih digunakan dan tidak dapat dihapus., code: stock_location_in_use } }
  /stock/balances:
    get:
      tags: [Inventory]
      summary: List saldo stok (read-only)
      parameters:
        - { name: item_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: stock_location_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: sort, in: query, schema: { type: string, enum: [updated_at, item_id, quantity_on_hand] } }
        - { $ref: '#/components/parameters/Direction' }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Page' }
      responses:
        '200':
          description: Daftar saldo (paginated).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/StockBalance' } }
                  links: { $ref: '#/components/schemas/PaginationLinks' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /stock/movements:
    get:
      tags: [Inventory]
      summary: List ledger movement (read-only)
      parameters:
        - { name: item_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: stock_location_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/StockMovementType' } }
        - { name: order_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: sort, in: query, schema: { type: string, enum: [occurred_at, created_at, id] } }
        - { $ref: '#/components/parameters/Direction' }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Page' }
      responses:
        '200':
          description: Daftar movement (paginated).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/StockMovement' } }
                  links: { $ref: '#/components/schemas/PaginationLinks' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /stock/opening-balances:
    post:
      tags: [Inventory]
      summary: Catat saldo awal (owner/admin; idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock_location_id, item_id, quantity, idempotency_key]
              properties:
                stock_location_id: { type: integer, minimum: 1 }
                item_id: { type: integer, minimum: 1 }
                quantity: { type: string, description: "> 0, maks 3 desimal", example: "10.000" }
                idempotency_key: { type: string, maxLength: 120 }
                note: { type: [string, "null"], maxLength: 255 }
      responses:
        '201': { description: Saldo awal dicatat. }
        '200': { description: Retry idempotent (idempotent=true). }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: opening_stock_conflict / idempotency_conflict / inventory_item_not_tracked / stock_invalid_quantity / stock_inconsistent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /stock/receipts:
    post:
      tags: [Inventory]
      summary: Catat barang masuk (owner/admin; idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock_location_id, item_id, quantity, idempotency_key]
              properties:
                stock_location_id: { type: integer, minimum: 1 }
                item_id: { type: integer, minimum: 1 }
                quantity: { type: string, description: "> 0, maks 3 desimal" }
                idempotency_key: { type: string, maxLength: 120 }
                reference: { type: [string, "null"], maxLength: 255 }
      responses:
        '201': { description: Barang masuk dicatat. }
        '200': { description: Retry idempotent. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: idempotency_conflict / inventory_item_not_tracked / stock_invalid_quantity / stock_inconsistent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /stock/adjustments:
    post:
      tags: [Inventory]
      summary: Koreksi stok hasil hitung fisik (owner/admin; idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock_location_id, item_id, counted_quantity, reason, idempotency_key]
              properties:
                stock_location_id: { type: integer, minimum: 1 }
                item_id: { type: integer, minimum: 1 }
                counted_quantity: { type: string, description: ">= 0, maks 3 desimal" }
                reason: { type: string, maxLength: 255 }
                idempotency_key: { type: string, maxLength: 120 }
      responses:
        '201': { description: Penyesuaian dicatat (adjustment_in/out). }
        '200': { description: Retry idempotent atau no-op (delta 0, no_op=true). }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: adjustment_below_reserved / idempotency_conflict / inventory_item_not_tracked / stock_invalid_quantity / stock_inconsistent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Ganti kata sandi user yang sedang login (membersihkan must_change_password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        '200':
          description: Kata sandi diubah.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      must_change_password: { type: boolean, enum: [false] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /current-store/members:
    get:
      tags: [Team]
      summary: Daftar anggota toko aktif (owner & admin)
      parameters:
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: role, in: query, required: false, schema: { $ref: '#/components/schemas/StoreRole' } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/MembershipStatus' } }
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
        - { name: sort, in: query, required: false, schema: { type: string, enum: [created_at, role] } }
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: Daftar anggota terpaginasikan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedStoreMembers' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: password_change_required / current_store_unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /current-store/members/admin:
    post:
      tags: [Team]
      summary: Buat akun admin (owner; maksimal satu admin aktif per toko)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 100 }
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        '201':
          description: Admin dibuat; akun wajib ganti kata sandi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/StoreMember' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: admin_limit_reached / email_already_registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /current-store/members/cashiers:
    post:
      tags: [Team]
      summary: Buat akun kasir (owner atau admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 100 }
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        '201':
          description: Kasir dibuat; akun wajib ganti kata sandi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/StoreMember' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: email_already_registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /current-store/members/{member}:
    get:
      tags: [Team]
      summary: Detail anggota toko aktif (owner & admin)
      parameters:
        - name: member
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Detail anggota.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/StoreMember' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /current-store/members/{member}/role:
    patch:
      tags: [Team]
      summary: Ubah role anggota admin <-> cashier (owner; owner tidak dapat diubah)
      parameters:
        - name: member
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [admin, cashier] }
      responses:
        '200':
          description: Role diperbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/StoreMember' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: admin_limit_reached / owner_protected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /current-store/members/{member}/status:
    patch:
      tags: [Team]
      summary: Aktifkan/nonaktifkan anggota (owner semua; admin hanya kasir)
      parameters:
        - name: member
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active: { type: boolean }
      responses:
        '200':
          description: Status diperbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/StoreMember' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: owner_protected / admin_limit_reached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
