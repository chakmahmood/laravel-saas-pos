          application/json:
            schema:
              type: object
              required: [payment_method, amount]
              properties:
                payment_method: { $ref: '#/components/schemas/PaymentMethod' }
                amount: { type: integer, minimum: 1 }
                reference_number: { type: [string, "null"], maxLength: 100 }
                notes: { type: [string, "null"], maxLength: 1000 }
                paid_at: { type: [string, "null"], format: date-time }
      responses:
        '201': { description: Pembayaran dicatat. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Order dibatalkan atau shift kas belum dibuka (tunai).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /payments/{payment}:
    parameters:
      - { name: payment, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Payments]
      summary: Detail pembayaran
      responses:
        '200': { description: Detail pembayaran. }
