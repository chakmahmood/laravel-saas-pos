openapi: 3.1.0
info:
  title: Universal POS SaaS API
  version: "0.4.0"
  description: |
    API backend Universal POS SaaS (Laravel 13 + Sanctum), multi-tenant per
    store. Semua endpoint bisnis memerlukan token Bearer dan konteks store aktif.

    Konvensi:
    - Uang = integer minor unit (rupiah bulat).
    - Kuantitas = string desimal 3 angka (`"1.125"`) untuk order/inventory.
    - Tanggal/waktu = ISO-8601 UTC (`...Z`) atau `null`.
    - Katalog item: id numerik. ID resource milik tenant lain => 404.
    - Semua error JSON memiliki `message` dan (kecuali 500) `code` stabil.
servers:
  - url: /api
    description: API root
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Current store
  - name: Categories
  - name: Items
  - name: Customers
  - name: Orders
  - name: Payments
  - name: Cash sessions
  - name: Inventory
  - name: Team
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  parameters:
    PerPage:
      name: per_page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    Direction:
      name: direction
      in: query
      required: false
      schema: { type: string, enum: [asc, desc], default: asc }
  responses:
    Unauthenticated:
      description: Token tidak ada / tidak valid / kedaluwarsa.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthenticationError' }
          example: { message: Tidak terautentikasi., code: unauthenticated }
    Forbidden:
      description: Tidak diizinkan (role atau capability).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Akses ditolak., code: forbidden }
    NotFound:
      description: Resource tidak ada pada scope tenant aktif.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Sumber daya tidak ditemukan., code: not_found }
    ValidationError:
      description: Validasi payload/query gagal.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
          example:
            message: The name field is required.
            code: validation_error
            errors: { name: [The name field is required.] }
    BusinessConflict:
      description: Konflik state bisnis.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Stok tidak mencukupi untuk salah satu item., code: insufficient_stock }
    TooManyRequests:
      description: Rate limit terlampaui.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Terlalu banyak permintaan. Silakan coba lagi nanti., code: too_many_requests }
  schemas:
    Error:
      type: object
      required: [message, code]
      properties:
        message: { type: string }
        code: { type: string }
    AuthenticationError:
      type: object
      required: [message, code]
      properties:
        message: { type: string }
        code: { type: string, enum: [unauthenticated, token_required, current_store_not_selected, current_store_unavailable] }
    ValidationError:
      type: object
      required: [message, code, errors]
      properties:
        message: { type: string }
        code: { type: string, enum: [validation_error] }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
    StoreRef:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        role: { $ref: '#/components/schemas/StoreRole' }
        business_type: { $ref: '#/components/schemas/BusinessType' }
        is_active: { type: boolean }
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: [string, "null"] }
        is_active: { type: boolean }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
    Item:
      type: object
      properties:
        id: { type: integer }
        category_id: { type: [integer, "null"] }
        name: { type: string }
        type: { $ref: '#/components/schemas/ItemType' }
        sku: { type: [string, "null"] }
        barcode: { type: [string, "null"] }
        description: { type: [string, "null"] }
        cost_price: { type: [integer, "null"] }
        selling_price: { type: integer }
        unit: { type: string }
        is_active: { type: boolean }
        tracks_stock: { type: boolean }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
    Customer:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        address: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
    OrderItem:
      type: object
      properties:
        id: { type: integer }
        item_id: { type: [integer, "null"] }
        item_name: { type: string }
        item_sku: { type: [string, "null"] }
        item_type: { $ref: '#/components/schemas/ItemType' }
        unit: { type: string }
        quantity: { type: string, description: desimal 3 angka, contoh "1.125" }
        unit_price: { type: integer }
        line_subtotal: { type: integer }
        discount_amount: { type: integer }
        line_total: { type: integer }
        notes: { type: [string, "null"] }
    Order:
      type: object
      properties:
        id: { type: integer }
        order_number: { type: string }
        customer_id: { type: [integer, "null"] }
        cashier_id: { type: [integer, "null"] }
        subtotal: { type: integer }
        discount_amount: { type: integer }
        tax_amount: { type: integer }
        total_amount: { type: integer }
        paid_amount: { type: integer }
        remaining_amount: { type: integer }
        payment_status: { $ref: '#/components/schemas/PaymentStatus' }
        fulfillment_status: { $ref: '#/components/schemas/FulfillmentStatus' }
        notes: { type: [string, "null"] }
        placed_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        cancelled_at: { type: [string, "null"], format: date-time }
        cancel_reason: { type: [string, "null"] }
        customer: { oneOf: [{ $ref: '#/components/schemas/Customer' }, { type: "null" }] }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        payments: { type: array, items: { $ref: '#/components/schemas/Payment' } }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
    Payment:
      type: object
      properties:
        id: { type: integer }
        order_id: { type: integer }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        amount: { type: integer }
        status: { $ref: '#/components/schemas/PaymentRecordStatus' }
        reference_number: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        paid_at: { type: [string, "null"], format: date-time }
        recorded_by: { type: [integer, "null"] }
        voided_at: { type: [string, "null"], format: date-time }
        voided_by: { type: [integer, "null"] }
        void_reason: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
    CashSession:
      type: object
      properties:
        id: { type: integer }
        cashier_id: { type: [integer, "null"] }
        status: { $ref: '#/components/schemas/CashSessionStatus' }
        opening_cash: { type: integer }
        cash_in_total: { type: integer }
        cash_out_total: { type: integer }
        cash_sales_total: { type: integer }
        expected_cash: { type: integer }
        actual_cash: { type: [integer, "null"] }
        difference: { type: [integer, "null"] }
        opened_at: { type: [string, "null"], format: date-time }
        closed_at: { type: [string, "null"], format: date-time }
        opening_notes: { type: [string, "null"] }
        closing_notes: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
    CashMovement:
      type: object
      properties:
        id: { type: integer }
        cash_session_id: { type: integer }
        user_id: { type: [integer, "null"] }
        type: { $ref: '#/components/schemas/CashMovementType' }
        amount: { type: integer }
        reason: { type: string }
        created_at: { type: [string, "null"], format: date-time }
    StockLocation:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: [string, "null"] }
        type: { $ref: '#/components/schemas/StockLocationType' }
        is_default: { type: boolean }
        is_active: { type: boolean }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
    StockBalance:
      type: object
      properties:
        id: { type: integer }
        stock_location_id: { type: integer }
        item_id: { type: integer }
        quantity_on_hand: { type: string }
        quantity_reserved: { type: string }
        quantity_available: { type: string }
        updated_at: { type: [string, "null"], format: date-time }
        item: { oneOf: [{ $ref: '#/components/schemas/Item' }, { type: "null" }] }
        stock_location: { oneOf: [{ $ref: '#/components/schemas/StockLocation' }, { type: "null" }] }
    StockMovement:
      type: object
      properties:
        id: { type: integer }
        item_id: { type: integer }
        stock_location_id: { type: integer }
        type: { $ref: '#/components/schemas/StockMovementType' }
        quantity: { type: string }
        unit_cost: { type: [integer, "null"] }
        order_id: { type: [integer, "null"] }
        order_item_id: { type: [integer, "null"] }
        idempotency_key: { type: [string, "null"] }
        note: { type: [string, "null"] }
        occurred_at: { type: [string, "null"], format: date-time }
        created_at: { type: [string, "null"], format: date-time }
        item: { oneOf: [{ $ref: '#/components/schemas/Item' }, { type: "null" }] }
        stock_location: { oneOf: [{ $ref: '#/components/schemas/StockLocation' }, { type: "null" }] }
    ItemStock:
      type: object
      properties:
        item_id: { type: integer }
        name: { type: string }
        unit: { type: string }
        tracks_stock: { type: boolean }
        balances: { type: array, items: { $ref: '#/components/schemas/StockBalance' } }
    StockMutation:
      type: object
      properties:
        movement: { oneOf: [{ $ref: '#/components/schemas/StockMovement' }, { type: "null" }] }
        balance: { $ref: '#/components/schemas/StockBalance' }
        idempotent: { type: boolean }
        no_op: { type: boolean }
    PaginationLinks:
      type: object
      properties:
        first: { type: [string, "null"] }
        last: { type: [string, "null"] }
        prev: { type: [string, "null"] }
        next: { type: [string, "null"] }
    PaginationMetaLink:
      type: object
      properties:
        url: { type: [string, "null"] }
        label: { type: string }
        active: { type: boolean }
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        from: { type: [integer, "null"] }
        last_page: { type: integer }
        links: { type: array, items: { $ref: '#/components/schemas/PaginationMetaLink' } }
        path: { type: string }
        per_page: { type: integer }
        to: { type: [integer, "null"] }
        total: { type: integer }
    ItemType:
      type: string
      enum: [product, service, menu, package]
    PaymentMethod:
      type: string
      enum: [cash, bank_transfer, card, e_wallet, other]
    PaymentRecordStatus:
      type: string
      enum: [completed, voided]
    PaymentStatus:
      type: string
      enum: [unpaid, partially_paid, paid, refunded]
    FulfillmentStatus:
      type: string
      enum: [pending, processing, completed, cancelled]
    CashSessionStatus:
      type: string
      enum: [open, closed]
    CashMovementType:
      type: string
      enum: [cash_in, cash_out]
    StockLocationType:
      type: string
      enum: [warehouse, outlet, other]
    StockMovementType:
      type: string
      enum: [opening, purchase_in, sale_out, adjustment_in, adjustment_out, transfer_in, transfer_out, return_in, return_out, reservation, reservation_release, reversal]
    BusinessType:
      type: string
      enum: [retail, service]
      description: |
        Grup bisnis utama (canonical). `retail` = Toko & Penjualan (warung,
        toko, kafe, restoran). `service` = Jasa & Servis (laundry, bengkel,
        salon, reparasi). Nilai lama (restaurant/laundry/repair/salon/other)
        masih diterima saat transisi dan dinormalisasi ke grup canonical.
    StoreRole:
      type: string
      enum: [owner, admin, cashier]
    MembershipStatus:
      type: string
      enum: [active, inactive]
    StoreMember:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/StoreRole' }
        status: { $ref: '#/components/schemas/MembershipStatus' }
        is_active: { type: boolean }
        must_change_password: { type: boolean, description: "true = akun baru wajib ganti kata sandi sebelum memakai POS." }
        joined_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
    PaginatedStoreMembers:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/StoreMember' } }
        links: { type: object }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrasi user + store pertama
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation, store_name, store_slug, business_type]
              properties:
                name: { type: string, maxLength: 100 }
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
                store_name: { type: string, maxLength: 150 }
                store_slug: { type: string, maxLength: 100 }
                business_type:
                  allOf:
                    - $ref: '#/components/schemas/BusinessType'
                  description: Wajib. Grup bisnis toko pertama. Alias lama dinormalisasi ke `retail`/`service`.
      responses:
        '201':
          description: Registrasi berhasil (membuat store, membership owner, free subscription, token).
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Login dan dapatkan token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Login berhasil (token). }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Cabut token saat ini
      responses:
        '200': { description: Logout berhasil. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /me:
    get:
      tags: [Current store]
      summary: User saat ini + daftar store yang dapat diakses
      responses:
        '200': { description: Data user dan stores. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /current-store:
    get:
      tags: [Current store]
      summary: Store aktif pada token saat ini
      responses:
        '200': { description: current_store atau null. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    put:
      tags: [Current store]
      summary: Ubah store aktif (per token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [store_id]
              properties:
                store_id: { type: integer }
      responses:
        '200': { description: Store aktif diubah. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /categories:
    get:
      tags: [Categories]
      summary: List kategori
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: is_active, in: query, schema: { type: string, enum: ['true','false','1','0'] } }
        - { name: sort, in: query, schema: { type: string, enum: [name, created_at] } }
        - { $ref: '#/components/parameters/Direction' }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Page' }
      responses:
        '200':
          description: Daftar kategori (paginated).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Category' } }
                  links: { $ref: '#/components/schemas/PaginationLinks' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Categories]
      summary: Buat kategori
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                description: { type: [string, "null"], maxLength: 1000 }
                is_active: { type: boolean }
      responses:
        '201': { description: Kategori dibuat. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /categories/{category}:
    parameters:
      - { name: category, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Categories]
      summary: Detail kategori
      responses:
        '200': { description: Detail kategori. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Categories]
      summary: Ganti kategori (name wajib)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                description: { type: [string, "null"] }
                is_active: { type: boolean }
      responses:
        '200': { description: Kategori diperbarui. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Categories]
      summary: Update sebagian kategori
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                description: { type: [string, "null"] }
                is_active: { type: boolean }
      responses:
        '200': { description: Kategori diperbarui. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Categories]
      summary: Hapus kategori (409 bila dipakai item)
      responses:
        '200': { description: Kategori dihapus. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Kategori masih dipakai item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: Kategori masih digunakan oleh item dan tidak dapat dihapus., code: category_in_use }
  /items:
    get:
      tags: [Items]
      summary: List item
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ItemType' } }
        - { name: category_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: is_active, in: query, schema: { type: string, enum: ['true','false','1','0'] } }
        - { name: sort, in: query, schema: { type: string, enum: [name, created_at, selling_price] } }
        - { $ref: '#/components/parameters/Direction' }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Page' }
      responses:
        '200':
          description: Daftar item (paginated).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Item' } }
                  links: { $ref: '#/components/schemas/PaginationLinks' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Items]
      summary: Buat item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, selling_price]
              properties:
                name: { type: string, maxLength: 150 }
                type: { $ref: '#/components/schemas/ItemType' }
                category_id: { type: [integer, "null"] }
                sku: { type: [string, "null"], maxLength: 64 }
                barcode: { type: [string, "null"], maxLength: 64 }
                description: { type: [string, "null"], maxLength: 2000 }
                cost_price: { type: [integer, "null"], minimum: 0 }
                selling_price: { type: integer, minimum: 0 }
                unit: { type: [string, "null"], maxLength: 20 }
                is_active: { type: boolean }
                tracks_stock: { type: boolean, description: "true hanya bila store mendukung inventory" }
      responses:
        '201': { description: Item dibuat. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /items/{item}:
    parameters:
      - { name: item, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Items]
      summary: Detail item
      responses:
        '200': { description: Detail item. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Items]
      summary: Ganti item (name/type/selling_price wajib)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, selling_price]
              properties:
                name: { type: string, maxLength: 150 }
                type: { $ref: '#/components/schemas/ItemType' }
                category_id: { type: [integer, "null"] }
                sku: { type: [string, "null"] }
                barcode: { type: [string, "null"] }
                description: { type: [string, "null"] }
                cost_price: { type: [integer, "null"] }
                selling_price: { type: integer, minimum: 0 }
                unit: { type: [string, "null"] }
                is_active: { type: boolean }
                tracks_stock: { type: boolean }
      responses:
        '200': { description: Item diperbarui. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Tidak dapat berhenti melacak stok karena ada histori.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
