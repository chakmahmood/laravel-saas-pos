  /orders:
    get:
      tags: [Orders]
      summary: List order
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: payment_status, in: query, schema: { $ref: '#/components/schemas/PaymentStatus' } }
        - { name: fulfillment_status, in: query, schema: { $ref: '#/components/schemas/FulfillmentStatus' } }
        - { name: customer_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: cashier_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: sort, in: query, schema: { type: string, enum: [placed_at, created_at, order_number, total_amount] } }
        - { $ref: '#/components/parameters/Direction' }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Page' }
      responses:
        '200':
          description: Daftar order (paginated).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Order' } }
                  links: { $ref: '#/components/schemas/PaginationLinks' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Orders]
      summary: Buat order (total dihitung server)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                customer_id: { type: [integer, "null"] }
                tax_amount: { type: integer, minimum: 0 }
                notes: { type: [string, "null"], maxLength: 1000 }
                idempotency_key: { type: string, maxLength: 100 }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [item_id, quantity]
                    properties:
                      item_id: { type: integer }
                      quantity: { type: number, exclusiveMinimum: 0, maximum: 999999 }
                      discount_amount: { type: integer, minimum: 0 }
      responses:
        '201': { description: Order dibuat. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Konflik inventory (mis. insufficient_stock / inventory_not_supported / stock_location_unavailable).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /orders/reconcile:
    get:
      tags: [Orders]
      summary: Rekonsiliasi order via idempotency key (read-only)
      parameters:
        - { name: idempotency_key, in: query, required: true, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Order milik toko aktif ditemukan.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Order' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404':
          description: Tidak ditemukan pada toko aktif (order_not_found).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /orders/{order}:
    parameters:
      - { name: order, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Orders]
      summary: Detail order (items, customer, payments)
      responses:
        '200': { description: Detail order. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{order}/fulfillment:
    parameters:
      - { name: order, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Orders]
      summary: Ubah fulfillment status (cancel = owner/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fulfillment_status]
              properties:
                fulfillment_status: { $ref: '#/components/schemas/FulfillmentStatus' }
                reason: { type: [string, "null"], maxLength: 255 }
      responses:
        '200': { description: Status diperbarui. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Order masih punya pembayaran aktif / konflik inventory.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /orders/{order}/payments:
    parameters:
